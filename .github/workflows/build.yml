name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip -q MKVEditor-Android-Project.zip -d extracted

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Fix settings.gradle.kts
      working-directory: extracted/MKVEditor-Android-Project
      run: |
        cat > settings.gradle.kts << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MKVEditor"
        include(":app")
        EOF

    - name: Create gradle.properties
      working-directory: extracted/MKVEditor-Android-Project
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=true
        kotlin.code.style=official
        EOF

    - name: Fix app/build.gradle.kts (SDK 34)
      working-directory: extracted/MKVEditor-Android-Project
      run: |
        sed -i 's/compileSdk = 35/compileSdk = 34/g' app/build.gradle.kts
        sed -i 's/targetSdk = 35/targetSdk = 34/g' app/build.gradle.kts

    - name: Generate Gradle wrapper
      working-directory: extracted/MKVEditor-Android-Project
      run: gradle wrapper --gradle-version 8.11.1

    - name: Build Debug APK
      working-directory: extracted/MKVEditor-Android-Project
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MKVEditor-APK
        path: extracted/MKVEditor-Android-Project/app/build/outputs/apk/debug/*.apk
