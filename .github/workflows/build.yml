name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip -q MKVEditor-Android-Project.zip -d extracted

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Fix settings.gradle.kts
      working-directory: extracted/MKVEditor-Android-Project
      run: |
        cat > settings.gradle.kts << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MKVEditor"
        include(":app")
        EOF

    - name: Fix app/build.gradle.kts
      working-directory: extracted/MKVEditor-Android-Project
      run: |
        cat > app/build.gradle.kts << 'EOF'
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example.mkveditor"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.example.mkveditor"
                minSdk = 26
                targetSdk = 35
                versionCode = 1
                versionName = "1.0.0"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }

            buildFeatures {
                compose = true
            }
        }

        dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.10.01"))
            implementation("androidx.core:core-ktx:1.15.0")
            implementation("androidx.activity:activity-compose:1.9.3")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.documentfile:documentfile:1.0.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
        }
        EOF

    - name: Create gradle.properties
      working-directory: extracted/MKVEditor-Android-Project
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=true
        kotlin.code.style=official
        EOF

    - name: Create missing resource files
      working-directory: extracted/MKVEditor-Android-Project/app/src/main
      run: |
        mkdir -p res/values res/xml res/drawable res/mipmap-anydpi-v26

        cat > res/values/strings.xml << 'EOF'
        <resources>
            <string name="app_name">MKV Editor</string>
        </resources>
        EOF

        cat > res/values/colors.xml << 'EOF'
        <resources>
            <color name="ic_launcher_background">#1E88E5</color>
            <color name="primary">#1E88E5</color>
            <color name="primary_dark">#1565C0</color>
        </resources>
        EOF

        cat > res/values/themes.xml << 'EOF'
        <resources>
            <style name="Theme.MKVEditor" parent="android:Theme.Material.Light.NoActionBar">
                <item name="android:statusBarColor">@color/primary_dark</item>
                <item name="android:windowBackground">@android:color/white</item>
            </style>
        </resources>
        EOF

        cat > res/xml/backup_rules.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content>
        </full-backup-content>
        EOF

        cat > res/xml/data_extraction_rules.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup>
            </cloud-backup>
            <device-transfer>
            </device-transfer>
        </data-extraction-rules>
        EOF

        cat > res/drawable/ic_launcher_foreground.xml << 'EOF'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#FFFFFF" android:pathData="M30,34 L78,34 L78,74 L30,74 Z" />
            <path android:fillColor="#1E88E5" android:pathData="M42,44 L42,64 L52,54 Z" />
            <path android:fillColor="#1E88E5" android:pathData="M56,44 L56,64 L66,54 Z" />
        </vector>
        EOF

        cat > res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
        </adaptive-icon>
        EOF

        cp res/mipmap-anydpi-v26/ic_launcher.xml res/mipmap-anydpi-v26/ic_launcher_round.xml

    - name: Generate Gradle wrapper
      working-directory: extracted/MKVEditor-Android-Project
      run: gradle wrapper --gradle-version 8.11.1

    - name: Build Debug APK
      working-directory: extracted/MKVEditor-Android-Project
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MKVEditor-APK
        path: extracted/MKVEditor-Android-Project/app/build/outputs/apk/debug/*.apk
